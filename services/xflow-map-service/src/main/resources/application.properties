spring.application.name=xflow-map-service

# --- CONFIGURATION PROFILES ---
spring.profiles.active=dev

# --- JPA / HIBERNATE / FLYWAY ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=map
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.schemas=map
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# --- ACTUATOR / MANAGEMENT ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.db.enabled=true

# --- FILE STORAGE / AWS S3 ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
storage.type=${STORAGE_TYPE:local}
storage.local.base-path=${LOCAL_STORAGE_PATH:./uploads/}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:}
aws.region.static=${AWS_REGION:eu-west-3}