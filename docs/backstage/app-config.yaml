# Base Backstage config — environment-agnostic.
# Development-only values (guest auth, permissive CSP, file-based catalog
# locations) live in app-config.dev.yaml, mounted by docker-compose.dev.yml.
# Production supplies its own values via environment variables
# (BACKSTAGE_BASE_URL, POSTGRES_*, GITHUB_TOKEN) or its own config overlay.
# GitHub integration lives in app-config.production.yaml so local dev
# (file-based catalog) does not require a GITHUB_TOKEN.
app:
  title: XFlow Developer Portal
  baseUrl: ${BACKSTAGE_BASE_URL:-http://localhost:7007}
  extensions:
    - app/routes:
        config:
          redirects:
            - from: /
              to: /catalog

backend:
  baseUrl: ${BACKSTAGE_BASE_URL:-http://localhost:7007}
  listen:
    port: 7007
    host: 0.0.0.0
  cors:
    origin: ${BACKSTAGE_BASE_URL:-http://localhost:7007}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-updates
  rules:
    - allow: [Component, System, API, Resource, Location]
