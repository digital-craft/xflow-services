app:
  title: XFlow Developer Portal
  baseUrl: http://localhost:7007

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    host: 0.0.0.0
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  providers:
    guest: {}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-updates
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: /catalog/catalog-info.yaml
    - type: file
      target: /catalog/services/xflow-auth-service/catalog-info.yaml
    - type: file
      target: /catalog/services/xflow-api-gateway/catalog-info.yaml
    - type: file
      target: /catalog/services/xflow-map-service/catalog-info.yaml
    - type: file
      target: /catalog/infra/catalog-info.yaml
    - type: file
      target: /catalog/docs/backstage/catalog-info.yaml
